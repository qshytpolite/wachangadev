name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Test ────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # Only runs on push or PR — never on tag-only events
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'            # caches pip deps — saves ~60s per run

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: 'True'
          DJANGO_SETTINGS_MODULE: portfolio.settings
        run: python manage.py migrate --run-syncdb

      - name: Django system check
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: 'True'
          ALLOWED_HOSTS: 'localhost'
          DJANGO_SETTINGS_MODULE: portfolio.settings
        run: python manage.py check --deploy 2>&1 | grep -v "WARNINGS" || true

      - name: Collect static (verify no errors)
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: 'False'
          DJANGO_SETTINGS_MODULE: portfolio.settings
        run: python manage.py collectstatic --noinput

  # ── Job 2: Deploy (main branch only) ──────────────────────────────────────
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test                   # only runs if test job passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --fail \
            --silent \
            --show-error
